name: Smart Inbox CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartinbox_test
          POSTGRES_USER: smartinbox
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartinbox -d smartinbox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SMARTINBOX_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=smartinbox_test;Username=smartinbox;Password=ci-test-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SmartInbox.sln
      - name: Release build
        run: dotnet build SmartInbox.sln --configuration Release --no-restore
      - name: Unit and PostgreSQL integration tests
        run: dotnet test SmartInbox.sln --configuration Release --no-build --no-restore
      - name: NuGet vulnerability audit
        run: dotnet list SmartInbox.sln package --vulnerable --include-transitive

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
      - name: npm dependency audit
        working-directory: web
        run: npm audit
