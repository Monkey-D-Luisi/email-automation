services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: smartinbox-postgres
    environment:
      POSTGRES_DB: ${SMARTINBOX_DB_NAME:-smartinbox_dev}
      POSTGRES_USER: ${SMARTINBOX_DB_USER:-smartinbox}
      POSTGRES_PASSWORD: ${SMARTINBOX_DB_PASSWORD:?Set SMARTINBOX_DB_PASSWORD to a local random value}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartinbox-postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartinbox-postgres-data:
