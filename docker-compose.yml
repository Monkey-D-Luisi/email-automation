services:
  n8n:
    image: n8nio/n8n:2.44.5
    container_name: smartinbox-n8n
    profiles: ["integrations"]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SMARTINBOX_API_ORIGIN: ${SMARTINBOX_API_ORIGIN:-http://host.docker.internal:5168}
      SMARTINBOX_GMAIL_MODE: ${SMARTINBOX_GMAIL_MODE:-disabled}
    volumes:
      - smartinbox-n8n-data:/home/node/.n8n
      - ./integrations/n8n:/opt/smartinbox/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: smartinbox-postgres
    environment:
      POSTGRES_DB: ${SMARTINBOX_DB_NAME:-smartinbox_test}
      POSTGRES_USER: ${SMARTINBOX_DB_USER:-smartinbox}
      POSTGRES_PASSWORD: ${SMARTINBOX_DB_PASSWORD:?Set SMARTINBOX_DB_PASSWORD to a local random value}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartinbox-postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartinbox-postgres-data:
  smartinbox-n8n-data:
